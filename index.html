<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos CEP – IES Isbilya</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CABECERA REDUCIDA -->
  <header class="topbar">
    <div class="top-left">
      <img src="logo_isbilya.png" class="logo">
      <span class="titulo">IES Isbilya – Actividades CEP</span>
    </div>

    <div class="top-right">
      <a href="https://educacionadistancia.juntadeandalucia.es/profesorado/" 
         target="_blank" class="aula-btn">
        Aula Virtual del Profesorado
      </a>
    </div>
  </header>

  <!-- FILTROS -->
  <section class="filtros">
    <input id="buscador" type="text" placeholder="Buscar actividad…">
    <select id="filtroCEP">
      <option value="TODOS">Todos los CEPs</option>
      <option value="SEVILLA">CEP Sevilla</option>
      <option value="CASTILLEJA">CEP Castilleja</option>
      <option value="OSUNA">CEP Osuna</option>
      <option value="MAIRENA">CEP Mairena</option>
      <option value="LEBRIJA">CEP Lebrija</option>
      <option value="LORA DEL RÍO">CEP Lora del Río</option>
    </select>
  </section>

  <!-- CONTADOR -->
  <div class="contador">
    Total actividades: <span id="totalCursos">0</span>
  </div>
  
  <div class="actualizacion">
  Última actualización: <span id="ultimaActualizacion">—</span>
</div>

  <!-- CONTENEDOR DE TARJETAS -->
  <div id="contenedor"></div>

  <script src="app.js"></script>
</body>
</html>
