name: Actualizar y desplegar CEP

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/scraper_sv_final.py

      - name: Verificar resultado
        run: |
          python3 -c "
          import json
          with open('data/actividades.json') as f:
              d = json.load(f)
          print(f'✅ {d[\"total\"]} actividades con plazo abierto')
          "

      - name: Generar HTML
        run: python build.py

      - name: Copiar logo
        run: cp logo_isbilya.png docs/ 2>/dev/null || echo "Sin logo"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
          
      - name: Prevenir que GitHub deshabilite el workflow
        uses: gautamkrishnar/keepalive-workflow@v2

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
