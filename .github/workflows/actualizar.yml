name: Actualizar y desplegar CEP

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/scraper_sv_final.py

      - name: Verificar resultado del scraper
        run: |
          echo "=== Actividades encontradas ==="
          python3 -c "
          import json
          with open('actividades.json') as f:
              d = json.load(f)
          print(f'✅ {len(d)} actividades')
          if d: print('Primera:', d[0].get('titulo','?'))
          "
          echo "=== Última actualización ==="
          cat ultima_actualizacion.txt

      - name: Preparar carpeta para Pages
        run: |
          mkdir -p _site
          cp index.html style.css app.js actividades.json ultima_actualizacion.txt _site/
          # Copia el logo si existe
          cp logo_isbilya.png _site/ 2>/dev/null || true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
