name: Scraper Híbrido AJAX Autodetectable + Deploy CEP

on:
  schedule:
    - cron: "0 * * * *"   # Cada hora
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt

      - name: Ejecutar scraper SV final
        run: |
            python scraper/scraper_sv_final.py

      - name: Guardar fecha y hora de actualización
        run: |
            export TZ="Europe/Madrid"
            date +"%d/%m/%Y %H:%M" > ultima_actualizacion.txt


      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add actividades.json ultima_actualizacion.txt
          git diff --cached --quiet || git commit -m "Actualiza actividades CEP (scraper híbrido AJAX autodetectable)"
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
