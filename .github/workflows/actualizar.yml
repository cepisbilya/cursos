name: Actualizar y desplegar CEP Radar

on:
  schedule:
    - cron: "0 * * * *"   # Cada hora
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: |
          python scraper/scraper_sv_final.py

      - name: Generar fecha de actualización
        run: |
          export TZ="Europe/Madrid"
          date +"%d/%m/%Y %H:%M" > ultima_actualizacion.txt

      - name: Listar archivos generados
        run: |
          echo "Contenido del directorio:"
          ls -la

      - name: Preparar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
