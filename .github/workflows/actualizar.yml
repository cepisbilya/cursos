name: Actualizar y desplegar CEP

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/scraper_sv_final.py

      - name: Generar fecha de actualización
        run: |
          export TZ="Europe/Madrid"
          date +"%d/%m/%Y %H:%M" > ultima_actualizacion.txt

      - name: Listar archivos generados
        run: |
          echo "=== Raíz del proyecto ==="
          ls -la
          echo "=== Archivos JSON/datos ==="
          find . -name "*.json" -not -path "./.git/*" | head -20

      - name: Preparar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
