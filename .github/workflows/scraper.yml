name: Scraper CEP (cron)

on:
  schedule:
    - cron: "0 * * * *"   # Cada hora en punto
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: |
          python scraper/scraper_sv_final.py

      - name: Guardar fecha de actualización
        run: |
          export TZ="Europe/Madrid"
          date +"%d/%m/%Y %H:%M" > ultima_actualizacion.txt

      - name: Empaquetar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: datos-cep
          path: |
            actividades.json
            ultima_actualizacion.txt
