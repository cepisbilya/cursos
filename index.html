<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos CEP Sevilla</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
  <h1>📚 Actividades Formativas CEP Sevilla</h1>
  <div class="stats">
    <div class="stat">
      <span id="totalCursos">0</span>
      <label>Total cursos</label>
    </div>
    <div class="stat">
      <span id="cursosAbiertos">0</span>
      <label>Abiertos</label>
    </div>
    <div class="stat">
      <span id="cursosCerrados">0</span>
      <label>Cerrados</label>
    </div>
  </div>
</header>


  <section id="filtros">
    <input id="buscador" type="text" placeholder="Buscar curso por título…">

    <select id="filtroCEP">
      <option value="TODOS">Todos los CEP</option>
      <option value="SEVILLA">Sevilla</option>
      <option value="CASTILLEJA">Castilleja</option>
      <option value="OSUNA">Osuna</option>
      <option value="MAIRENA">Mairena</option>
      <option value="LEBRIJA">Lebrija</option>
      <option value="LORA DEL RÍO">Lora del Río</option>
    </select>
  </section>

  <main id="contenedor"></main>

  <footer>
    <p>Actualizado automáticamente cada día · Datos de Secretaría Virtual y webs de los CEPs</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
